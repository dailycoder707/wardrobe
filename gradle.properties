# Project-wide Gradle settings.

# JVM args for the Gradle daemon. Room/Hilt/KSP annotation processing across 20 modules
# benefits from headroom; 4g is conservative for a dev laptop, raise if CI has more.
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Use Gradle's parallel project execution and configuration cache — real wins on a
# 20-module build.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# AGP 9's "built-in Kotlin" is off: it hard-rejects the traditional
# org.jetbrains.kotlin.android / org.jetbrains.kotlin.jvm plugins that KSP, Room,
# Hilt, ktlint and Detekt are all still built around as of this stack's versions
# (verified by actually running the build and hitting that exact rejection).
# Google's own AGP 9.0 release notes flag this opt-out as a temporary bridge that
# will be removed in AGP 10 — revisit this project's plugin model before then.
android.builtInKotlin=false

# AGP 9.2's "new DSL" (android.newDsl=true, on by default) is what actually
# rejects org.jetbrains.kotlin.android at the API level (a ClassCastException
# on the old BaseExtension type, discovered by running the build) — the
# builtInKotlin flag alone wasn't enough. Both flags are part of the same
# temporary bridge and should be revisited together before AGP 10.
android.newDsl=false

# Suppress the "unsupported Kotlin plugin" warning noise from AGP/KGP version skew
# checks; version compatibility is verified explicitly in this project's version
# catalog instead of relying on the IDE nag.
kotlin.suppressUnsupportedCompilerWarning=true

# R8 full mode (default since AGP 8, stated explicitly for clarity — Section 23)
android.enableR8.fullMode=true

# Non-transitive R class: each module only sees its own resource IDs, not the whole
# dependency graph's — required at this module count to keep R class generation fast
# and to catch accidental cross-module resource references at compile time.
android.nonTransitiveRClass=true

# Non-final resource IDs are the default and required for library modules; kept
# explicit rather than left implicit.
android.nonFinalResIds=true
